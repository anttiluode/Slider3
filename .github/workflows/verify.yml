name: Verify Slider3 physical and numerical controls
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: slider3-verify
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check all JavaScript syntax and reproducible mathematics
        run: |
          node --check core.js
          node --check worker.js
          node --check app.js
          node tests.cjs
          node --check paper-current.js
          node --check paper-planar.js
          node paper-tests.cjs
          node --check paper-evidence.js
          node paper-evidence-tests.cjs
          node --check paper-worker.js
          node --check paper-app.js
